name: Deploy Cloudflare Worker (RMBG)

on:
  push:
    paths:
      - 'rmbg-worker.js'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via CF REST API
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          set -e

          echo "Verifying token..."
          curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Token:', d.get('result',{}).get('status')); [print('ERR:', e) for e in d.get('errors',[])]"

          echo "Getting account..."
          ACCOUNT_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/memberships?status=active | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['account']['id'])")
          echo "Account: $ACCOUNT_ID"

          echo "Deploying worker..."
          curl -sf -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata={\"main_module\":\"rmbg-worker.js\"}" \
            -F "rmbg-worker.js=@rmbg-worker.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/dolapy-rmbg" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('OK:', d.get('success')); [print('ERR:', e) for e in d.get('errors',[])]"

          echo "Enabling workers.dev..."
          curl -s -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/dolapy-rmbg/subdomain" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Subdomain:', d.get('success'), d.get('errors'))"

      - name: Health check
        run: |
          sleep 5
          curl -sf https://dolapy-rmbg.marwanmorsy999.workers.dev/health && echo "LIVE" || echo "Pending"
