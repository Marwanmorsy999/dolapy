name: Deploy Cloudflare Worker (RMBG)

on:
  push:
    paths:
      - 'rmbg-worker.js'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          INFERENCE_KEY: ${{ secrets.HF_TOKEN }}
        run: |
          sed "s/REPLACE_ME/$INFERENCE_KEY/g" rmbg-worker.js > /tmp/built.js

          ACCT=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/memberships?status=active" | \
            python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['account']['id'] if r else '')")
          echo "Account: $ACCT"
          [ -z "$ACCT" ] && echo "No account ID" && exit 1

          curl -sf -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata={\"main_module\":\"w.js\"}" \
            -F "w.js=@/tmp/built.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/dolapy-rmbg" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('ok:',d.get('success'),'errors:',d.get('errors',[]))"

          curl -s -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" -d '{"enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/dolapy-rmbg/subdomain" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('subdomain:',d.get('success'))"

          echo "Live: https://dolapy-rmbg.marwanmorsy999.workers.dev/health"
