name: Deploy Cloudflare Worker (RMBG)

on:
  push:
    paths:
      - 'rmbg-worker.js'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "dolapy-rmbg"
          main = "rmbg-worker.js"
          compatibility_date = "2024-09-01"
          EOF

      - name: Deploy via Wrangler Action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_TOKEN }}
          command: deploy rmbg-worker.js --name dolapy-rmbg --compatibility-date 2024-09-01 --no-bundle

      - name: Health check
        run: |
          sleep 5
          curl -sf https://dolapy-rmbg.marwanmorsy999.workers.dev/health && echo "Worker live" || echo "Health check pending (normal on first deploy)"
