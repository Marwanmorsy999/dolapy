name: Materialize Cloudflare-ready Dolapy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and replace workspace
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .upload-payload/part01.b64 ]; then
            echo "No pending Dolapy payload; nothing to do."
            exit 0
          fi

          cat .upload-payload/part01.b64 \
              .upload-payload/part02.b64 \
              .upload-payload/part03.b64 \
              .upload-payload/part04.b64 \
              .upload-payload/part05.b64 > /tmp/dolapy-payload.b64

          base64 --decode /tmp/dolapy-payload.b64 > /tmp/dolapy-clean.tar.gz
          expected='1b9c5689abc896e884fcb87af877e9dcc71b6a2829f9c832a0affa1298487d0b'
          actual="$(sha256sum /tmp/dolapy-clean.tar.gz | cut -d' ' -f1)"
          test "$actual" = "$expected"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          tar -xzf /tmp/dolapy-clean.tar.gz -C .
          rm -rf .upload-payload

      - name: Commit clean project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Materialize Cloudflare-ready Dolapy source"
          git push
