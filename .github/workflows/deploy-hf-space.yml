name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          # Delete old space (clear any SDK lock from Docker experiment)
          curl -s -X DELETE \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg"}' \
            https://huggingface.co/api/repos/delete || true

          sleep 3

          # Recreate as gradio SDK
          curl -sf -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' \
            https://huggingface.co/api/repos/create

          sleep 2

          # Push files
          cd hf-space
          git init
          git config user.email "maro@dolapy.app"
          git config user.name "Dolapy"
          git add -A
          git commit -m "Deploy RMBG-2.0 FastAPI"
          git push --force \
            "https://Marwanmorsy999:$HF_TOKEN@huggingface.co/spaces/Marwanmorsy999/dolapy-rmbg" \
            HEAD:main

          echo "Done: https://marwanmorsy999-dolapy-rmbg.hf.space/remove-bg"
