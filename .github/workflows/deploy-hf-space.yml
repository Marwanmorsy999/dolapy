name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files via HF API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -ex

          # Create space if needed
          curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' \
            https://huggingface.co/api/repos/create || true

          # Upload each file via HF commit API
          APP_CONTENT=$(base64 -w0 hf-space/app.py)
          REQ_CONTENT=$(base64 -w0 hf-space/requirements.txt)
          README_CONTENT=$(base64 -w0 hf-space/README.md)

          curl -sf -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"operations\": [
                {\"op\":\"addOrUpdate\",\"path\":\"app.py\",\"content\":\"$APP_CONTENT\"},
                {\"op\":\"addOrUpdate\",\"path\":\"requirements.txt\",\"content\":\"$REQ_CONTENT\"},
                {\"op\":\"addOrUpdate\",\"path\":\"README.md\",\"content\":\"$README_CONTENT\"}
              ],
              \"commit_message\": \"Deploy RMBG-2.0\"
            }" \
            "https://huggingface.co/api/spaces/Marwanmorsy999/dolapy-rmbg/commit/main"

          echo "Upload complete."
          echo "Space: https://huggingface.co/spaces/Marwanmorsy999/dolapy-rmbg"
