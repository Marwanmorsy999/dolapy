name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files via HF API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' \
            https://huggingface.co/api/repos/create || true

          curl -sf -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"operations": [{"op": "addOrUpdate", "path": "app.py", "content": ""}, {"op": "addOrUpdate", "path": "requirements.txt", "content": "dG9yY2gKdG9yY2h2aXNpb24KdHJhbnNmb3JtZXJzPj00LjM4LjAKZ3JhZGlvPj00LjQ0LjAKUGlsbG93Cm51bXB5CmZhc3RhcGkKcHl0aG9uLW11bHRpcGFydAp1dmljb3JuCg=="}, {"op": "addOrUpdate", "path": "README.md", "content": ""}], "commit_message": "Deploy RMBG-2.0 FastAPI"}' \
            "https://huggingface.co/api/spaces/Marwanmorsy999/dolapy-rmbg/commit/main"

          echo "Done: https://marwanmorsy999-dolapy-rmbg.hf.space/remove-bg"
