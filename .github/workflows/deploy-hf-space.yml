name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Space if it doesn't exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -s -X POST https://huggingface.co/api/repos/create \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' || true

      - name: Push files to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd hf-space
          git init
          git config user.email "dolapy@users.noreply.huggingface.co"
          git config user.name "Dolapy Bot"
          git add .
          git commit -m "Deploy: FastAPI + Gradio at /ui"
          git push --force https://Marwanmorsy999:${HF_TOKEN}@huggingface.co/spaces/Marwanmorsy999/dolapy-rmbg main
          echo "Space: https://huggingface.co/spaces/Marwanmorsy999/dolapy-rmbg"
          echo "API:   https://marwanmorsy999-dolapy-rmbg.hf.space/remove-bg"
          echo "Health: https://marwanmorsy999-dolapy-rmbg.hf.space/health"
