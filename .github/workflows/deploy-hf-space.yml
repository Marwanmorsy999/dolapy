name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare and push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          echo "=== Create space (ok if exists) ==="
          curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' \
            https://huggingface.co/api/repos/create || true

          sleep 2

          echo "=== Push files ==="
          cd hf-space
          git init
          git config user.email "maro@dolapy.app"
          git config user.name "Dolapy"
          git add -A
          git commit -m "Deploy RMBG-2.0 FastAPI"

          GIT_TERMINAL_PROMPT=0 git push --force \
            "https://Marwanmorsy999:${HF_TOKEN}@huggingface.co/spaces/Marwanmorsy999/dolapy-rmbg" \
            HEAD:main 2>&1

          echo "=== Done ==="
