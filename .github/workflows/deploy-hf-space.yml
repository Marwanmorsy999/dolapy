name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Space if it doesn't exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Creating space..."
          curl -s -X POST https://huggingface.co/api/repos/create \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' | python3 -c "import sys,json; d=json.load(sys.stdin); print('Create result:', d.get('url','already exists'))" || true

      - name: Push files to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          echo "Token prefix: ${HF_TOKEN:0:10}..."
          
          # Verify token
          curl -sf -H "Authorization: Bearer ${HF_TOKEN}" \
            https://huggingface.co/api/whoami-v2 | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('HF user:', d.get('name','unknown'))
" || echo "Token check failed"

          cd hf-space
          git init
          git config user.email "maro@dolapy.app"
          git config user.name "Dolapy"
          git add -A
          git status
          git commit -m "Deploy: RMBG-2.0 FastAPI + Gradio UI"
          
          # Try push with verbose output
          GIT_TERMINAL_PROMPT=0 git push --force \
            "https://Marwanmorsy999:${HF_TOKEN}@huggingface.co/spaces/Marwanmorsy999/dolapy-rmbg" \
            HEAD:main 2>&1
          
          echo "Push complete."
