name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files via HF API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Token starts with: ${HF_TOKEN:0:12}"

          echo "=== Whoami ==="
          curl -s -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/whoami-v2

          echo ""
          echo "=== Create/check space ==="
          curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' \
            https://huggingface.co/api/repos/create

          echo ""
          echo "=== Commit API test ==="
          README='LS0tCnRpdGxlOiBEb2xhcHkgUk1CRwplbW9qaTogNDUKY29sb3JGcm9tOiB5ZWxsb3cKY29sb3JUbzogZ3JlZW4Kc2RrOiBncmFkaW8Kc2RrX3ZlcnNpb246ICI0LjQ0LjAiCmFwcF9maWxlOiBhcHAucHkKcGlubmVkOiB0cnVlCi0tLQoKIyBEb2xhcHkgUk1CRwo='

          curl -sv -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"operations\":[{\"op\":\"addOrUpdate\",\"path\":\"README.md\",\"content\":\"$README\"}],\"commit_message\":\"test\"}" \
            "https://huggingface.co/api/spaces/Marwanmorsy999/dolapy-rmbg/commit/main" 2>&1

          echo ""
          echo "=== Done ==="
