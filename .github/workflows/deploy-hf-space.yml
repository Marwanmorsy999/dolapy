name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files via HF API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          curl -s -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"space","name":"dolapy-rmbg","private":false,"sdk":"gradio"}' \
            https://huggingface.co/api/repos/create || true

          APP=$(base64 -w0 hf-space/app.py)
          REQS=$(base64 -w0 hf-space/requirements.txt)
          README=$(base64 -w0 hf-space/README.md)

          printf '{"operations":[{"op":"addOrUpdate","path":"app.py","content":"%s"},{"op":"addOrUpdate","path":"requirements.txt","content":"%s"},{"op":"addOrUpdate","path":"README.md","content":"%s"}],"commit_message":"Deploy RMBG-2.0"}' \
            "$APP" "$REQS" "$README" > /tmp/payload.json

          curl -sf -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json \
            "https://huggingface.co/api/spaces/Marwanmorsy999/dolapy-rmbg/commit/main"

          echo "Done"
