name: Deploy RMBG Space to HuggingFace

on:
  push:
    paths:
      - 'hf-space/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install huggingface_hub
        run: pip install huggingface_hub -q

      - name: Upload files via huggingface_hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          repo_id = "Marwanmorsy999/dolapy-rmbg"

          # Create space if needed
          try:
              api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="gradio", exist_ok=True)
              print("Space ready")
          except Exception as e:
              print(f"Create warning: {e}")

          # Upload files
          for local, remote in [
              ("hf-space/app.py", "app.py"),
              ("hf-space/requirements.txt", "requirements.txt"),
              ("hf-space/README.md", "README.md"),
          ]:
              api.upload_file(
                  path_or_fileobj=local,
                  path_in_repo=remote,
                  repo_id=repo_id,
                  repo_type="space",
              )
              print(f"Uploaded {remote}")

          print("Done: https://marwanmorsy999-dolapy-rmbg.hf.space/remove-bg")
          PYEOF
